<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Partial_Styles'); ?>
</head>
<body>
  <div class="app-shell">
    <?!= include('Partial_Sidebar'); ?>
    <main class="main-content">
      <header class="topbar">
        <h1>My QR Code</h1>
        <div class="topbar-user">
          <div><div class="js-user-name" style="font-weight:600;"></div><div class="js-user-role text-muted" style="font-size:11.5px;"></div></div>
          <div class="avatar js-user-avatar"></div>
        </div>
      </header>

      <div class="page-body">
        <div class="panel" id="qrPanel">
          <div class="qr-card" id="qrCardContent">
            <div class="spinner"></div>
          </div>
          <div class="modal-actions no-print" style="justify-content:center;">
            <button class="btn secondary" onclick="downloadQR()">Download</button>
            <button class="btn" onclick="printQR()">Print</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <?!= include('Partial_Scripts'); ?>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    var webAppUrl = <?!= JSON.stringify(webAppUrl || '') ?>;
    var employee = null;

    document.addEventListener('DOMContentLoaded', function () {
      var session = initShell('my-qr', ['Employee']);
      if (!session) return;
      api('getMyQR', {}).then(function (res) {
        employee = res.employee;
        renderCard();
      }).catch(function (err) { toast(err.message, true); });
    });

    function renderCard() {
      var url = buildScanUrl(webAppUrl, employee.QRToken);
      QRCode.toDataURL(url, { width: 240, margin: 1, color: { dark: '#0d3b1f', light: '#ffffff' } }, function (err, dataUrl) {
        document.getElementById('qrCardContent').innerHTML =
          '<div class="org">LGU Time Tracker</div>' +
          (employee.PhotoURL ? '<img src="' + employee.PhotoURL + '" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin:8px auto;">' : '') +
          '<div class="name">' + escapeHtml(employee.FullName) + '</div>' +
          '<div class="empid">' + escapeHtml(employee.EmployeeID) + ' &middot; ' + escapeHtml(employee.Department) + '</div>' +
          '<div id="qrCanvasWrap"><img src="' + dataUrl + '" width="240" height="240"></div>' +
          '<div class="text-muted" style="font-size:12px;">Scan to record attendance</div>';
        document.getElementById('qrCardContent').dataset.dataurl = dataUrl;
      });
    }

    function downloadQR() {
      var dataUrl = document.getElementById('qrCardContent').dataset.dataurl;
      if (dataUrl) downloadDataUrl(dataUrl, employee.EmployeeID + '-qr.png');
    }
    function printQR() {
      var dataUrl = document.getElementById('qrCardContent').dataset.dataurl;
      if (dataUrl) printQrCard(dataUrl, { fullName: employee.FullName, employeeId: employee.EmployeeID, department: employee.Department });
    }
  </script>
</body>
</html>
