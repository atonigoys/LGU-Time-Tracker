<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Partial_Styles'); ?>
</head>
<body>
  <div class="app-shell">
    <?!= include('Partial_Sidebar'); ?>
    <main class="main-content">
      <header class="topbar">
        <h1>Attendance Records</h1>
        <div class="topbar-user">
          <div><div class="js-user-name" style="font-weight:600;"></div><div class="js-user-role text-muted" style="font-size:11.5px;"></div></div>
          <div class="avatar js-user-avatar"></div>
        </div>
      </header>

      <div class="page-body">
        <div class="panel">
          <div class="panel-title">Filters</div>
          <div class="filters-bar">
            <input type="text" id="fSearch" placeholder="Search name or ID…">
            <select id="fDept"><option value="">All Departments</option></select>
            <select id="fStatus">
              <option value="">All Statuses</option>
              <option value="PRESENT">Present</option>
              <option value="LATE">Late</option>
            </select>
            <input type="date" id="fFrom">
            <input type="date" id="fTo">
            <button class="btn" onclick="loadAttendance()">Apply</button>
          </div>
        </div>

        <div class="panel">
          <div class="flex-between" style="margin-bottom:10px;">
            <div class="panel-title" style="margin:0;">Records</div>
            <span class="text-muted" id="rowCount"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Employee</th><th>Department</th><th>Time In</th><th>Time Out</th><th>Status</th><th>Late (min)</th><th>Total Hrs</th><th>OT Hrs</th></tr></thead>
              <tbody id="tblBody"><tr><td colspan="9" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <?!= include('Partial_Scripts'); ?>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var session = initShell('attendance', ['Admin', 'HR']);
      if (!session) return;
      var today = new Date().toISOString().slice(0, 10);
      var monthAgo = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
      document.getElementById('fFrom').value = monthAgo;
      document.getElementById('fTo').value = today;
      loadDepartments();
      loadAttendance();
    });

    function loadDepartments() {
      api('getDepartments', {}).then(function (res) {
        var sel = document.getElementById('fDept');
        res.departments.forEach(function (d) {
          var opt = document.createElement('option');
          opt.value = d.DepartmentName; opt.textContent = d.DepartmentName;
          sel.appendChild(opt);
        });
      });
    }

    function loadAttendance() {
      var filters = {
        search: document.getElementById('fSearch').value,
        department: document.getElementById('fDept').value,
        status: document.getElementById('fStatus').value,
        dateFrom: document.getElementById('fFrom').value,
        dateTo: document.getElementById('fTo').value
      };
      api('getAttendance', { filters: filters }).then(function (res) {
        renderTable(res.attendance);
      }).catch(function (err) { toast(err.message, true); });
    }

    function renderTable(rows) {
      document.getElementById('rowCount').textContent = rows.length + ' record(s)';
      var tbody = document.getElementById('tblBody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty-state">No attendance records match your filters.</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(function (r) {
        return '<tr>' +
          '<td>' + escapeHtml(r.Date) + '</td>' +
          '<td><strong>' + escapeHtml(r.FullName) + '</strong><br><span class="text-muted" style="font-size:11.5px;">' + escapeHtml(r.EmployeeID) + '</span></td>' +
          '<td>' + escapeHtml(r.Department) + '</td>' +
          '<td>' + escapeHtml(r.TimeIn || '-') + '</td>' +
          '<td>' + escapeHtml(r.TimeOut || '-') + '</td>' +
          '<td>' + statusBadge(r.Status) + '</td>' +
          '<td>' + (r.LateMinutes || 0) + '</td>' +
          '<td>' + (r.TotalHours || '-') + '</td>' +
          '<td>' + (r.OvertimeHours || '-') + '</td>' +
          '</tr>';
      }).join('');
    }
  </script>
</body>
</html>
