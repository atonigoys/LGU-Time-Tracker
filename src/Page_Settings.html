<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Partial_Styles'); ?>
</head>
<body>
  <div class="app-shell">
    <?!= include('Partial_Sidebar'); ?>
    <main class="main-content">
      <header class="topbar">
        <h1>Settings</h1>
        <div class="topbar-user">
          <div><div class="js-user-name" style="font-weight:600;"></div><div class="js-user-role text-muted" style="font-size:11.5px;"></div></div>
          <div class="avatar js-user-avatar"></div>
        </div>
      </header>

      <div class="page-body">
        <div class="panel">
          <div class="panel-title">Organization</div>
          <form id="orgForm">
            <div class="form-row">
              <label>Organization Name</label>
              <input type="text" id="fOrgName" placeholder="Local Government Unit of ...">
            </div>
            <button type="submit" class="btn">Save</button>
          </form>
        </div>

        <div class="panel">
          <div class="panel-title">Change My Password</div>
          <form id="pwForm">
            <div class="form-grid">
              <div class="form-row"><label>Current Password</label><input type="password" id="fOld" required></div>
              <div class="form-row"><label>New Password</label><input type="password" id="fNew" required minlength="8"></div>
            </div>
            <button type="submit" class="btn">Update Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <?!= include('Partial_Scripts'); ?>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var session = initShell('settings', ['Admin']);
      if (!session) return;
      api('getSettings', {}).then(function (res) {
        document.getElementById('fOrgName').value = res.settings.ORG_NAME || '';
      });
      document.getElementById('orgForm').addEventListener('submit', function (e) {
        e.preventDefault();
        api('saveSetting', { key: 'ORG_NAME', value: document.getElementById('fOrgName').value.trim() })
          .then(function () { toast('Saved.'); })
          .catch(function (err) { toast(err.message, true); });
      });
      document.getElementById('pwForm').addEventListener('submit', function (e) {
        e.preventDefault();
        api('changePassword', { oldPassword: document.getElementById('fOld').value, newPassword: document.getElementById('fNew').value })
          .then(function () { toast('Password updated.'); document.getElementById('pwForm').reset(); })
          .catch(function (err) { toast(err.message, true); });
      });
    });
  </script>
</body>
</html>
