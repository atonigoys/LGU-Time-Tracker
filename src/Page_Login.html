<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Partial_Styles'); ?>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">LGU</div>
      <h1>LGU Time Tracker</h1>
      <div class="sub">Daily Time Record &amp; QR Attendance System</div>

      <div class="error-box" id="errorBox"></div>

      <form id="loginForm">
        <div class="form-row">
          <label>Email Address</label>
          <input type="email" id="email" required autocomplete="username" placeholder="you@lgu.local">
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn block" id="loginBtn">Log In</button>
      </form>

      <div class="demo-box">
        <strong>Demo accounts</strong> (change before going live):<br>
        Admin: admin@lgu.local / Admin@123<br>
        Employee: employee@lgu.local / Employee@123
      </div>
    </div>
  </div>

  <?!= include('Partial_Scripts'); ?>
  <script>
    (function () {
      var existing = LGU.getSession();
      if (existing && existing.token) {
        gotoPage(existing.user.role === 'Employee' ? 'employee-dashboard' : 'dashboard');
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      rpc('login', { email: email, password: password }).then(function (res) {
        if (!res.success) throw new Error(res.error || 'Login failed.');
        LGU.setSession({ token: res.token, user: res.user });
        gotoPage(res.user.role === 'Employee' ? 'employee-dashboard' : 'dashboard');
      }).catch(function (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log In';
      });
    });
  </script>
</body>
</html>
