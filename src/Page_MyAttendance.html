<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Partial_Styles'); ?>
</head>
<body>
  <div class="app-shell">
    <?!= include('Partial_Sidebar'); ?>
    <main class="main-content">
      <header class="topbar">
        <h1>My Attendance (DTR)</h1>
        <div class="topbar-user">
          <div><div class="js-user-name" style="font-weight:600;"></div><div class="js-user-role text-muted" style="font-size:11.5px;"></div></div>
          <div class="avatar js-user-avatar"></div>
        </div>
      </header>

      <div class="page-body">
        <div class="panel no-print">
          <div class="filters-bar">
            <input type="date" id="fFrom">
            <input type="date" id="fTo">
            <button class="btn" onclick="loadHistory()">Apply</button>
            <button class="btn secondary" onclick="window.print()">Print DTR</button>
          </div>
        </div>
        <div class="panel">
          <div class="flex-between" style="margin-bottom:10px;">
            <div class="panel-title" style="margin:0;">Daily Time Record</div>
            <span class="text-muted" id="rowCount"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Time In</th><th>Time Out</th><th>Status</th><th>Late (min)</th><th>Total Hrs</th><th>OT Hrs</th></tr></thead>
              <tbody id="tblBody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <?!= include('Partial_Scripts'); ?>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var session = initShell('my-attendance', ['Employee']);
      if (!session) return;
      var today = new Date().toISOString().slice(0, 10);
      var monthAgo = new Date(Date.now() - 60 * 86400000).toISOString().slice(0, 10);
      document.getElementById('fFrom').value = monthAgo;
      document.getElementById('fTo').value = today;
      loadHistory();
    });

    function loadHistory() {
      api('getMyAttendance', { dateFrom: document.getElementById('fFrom').value, dateTo: document.getElementById('fTo').value }).then(function (res) {
        document.getElementById('rowCount').textContent = res.attendance.length + ' record(s)';
        var tbody = document.getElementById('tblBody');
        if (!res.attendance.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No attendance records in this range.</td></tr>'; return; }
        tbody.innerHTML = res.attendance.map(function (r) {
          return '<tr>' +
            '<td>' + escapeHtml(r.Date) + '</td>' +
            '<td>' + escapeHtml(r.TimeIn || '-') + '</td>' +
            '<td>' + escapeHtml(r.TimeOut || '-') + '</td>' +
            '<td>' + statusBadge(r.Status) + '</td>' +
            '<td>' + (r.LateMinutes || 0) + '</td>' +
            '<td>' + (r.TotalHours || '-') + '</td>' +
            '<td>' + (r.OvertimeHours || '-') + '</td>' +
            '</tr>';
        }).join('');
      }).catch(function (err) { toast(err.message, true); });
    }
  </script>
</body>
</html>
